<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spade — Guided Test &amp; Score</title>
<style>
  :root{
    --bg:#0b0b0d; --bg-1:#111114; --bg-2:#16161a; --bg-3:#1c1c22; --bg-4:#232329;
    --line:#26262d; --line-2:#2f2f37; --line-strong:#3a3a44;
    --text:#ecedef; --text-2:#b9bac1; --text-3:#82838c; --text-4:#5b5c66;
    --accent:#c9b8ff; --accent-2:#8e7dff;
    --green:#7ad19a; --amber:#e6b86a; --red:#e87d7d; --blue:#7ab6e6; --teal:#7adcc7;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Inter Tight",ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  code,.mono{font-family:var(--mono);font-size:.85em}
  code{background:var(--bg-3);padding:1px 5px;border-radius:4px;color:var(--text-2)}
  .wrap{max-width:920px;margin:0 auto;padding:0 22px 130px}
  kbd{font-family:var(--mono);font-size:.8em;background:var(--bg-1);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text)}

  /* sticky scoreboard */
  header.bar{position:sticky;top:0;z-index:30;background:rgba(11,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .bar-inner{max-width:920px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#d2c3ff,#8e7dff)}
  .score-box{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
  .meter{width:150px;height:8px;border-radius:999px;background:var(--bg-3);overflow:hidden;border:1px solid var(--line)}
  .meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .25s}
  .score-num{font-family:var(--mono);font-size:20px;font-weight:600}
  .score-sub{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}

  /* tab bar */
  nav.tabs{position:sticky;top:53px;z-index:25;background:rgba(11,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto;}
  .tabs-inner{max-width:920px;margin:0 auto;padding:0 16px;display:flex;gap:2px}
  .tab{flex:none;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font:inherit;font-size:13px;padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .tab:hover{color:var(--text-2)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .tab .tnum{font-family:var(--mono);font-size:10px;width:18px;height:18px;display:inline-grid;place-items:center;border-radius:50%;background:var(--bg-3);color:var(--text-3)}
  .tab.active .tnum{background:var(--accent);color:#1a1730}
  .tab .tsc{font-family:var(--mono);font-size:10px;color:var(--text-4)}

  .panel{display:none;padding-top:26px}
  .panel.active{display:block}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
  h2.ph{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
  .lede{color:var(--text-2);max-width:72ch}
  .blurb{color:var(--text-3);margin:6px 0 18px;max-width:72ch}

  .note{background:var(--bg-1);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin:16px 0;color:var(--text-2)}
  .note.warn{border-left-color:var(--amber)}
  .note.tip{border-left-color:var(--green)}

  .meta-row{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4)}
  .field input{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--text);font-family:var(--sans);outline:none}
  .field input:focus{border-color:var(--accent)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .btn{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--bg-1);color:var(--text-2);padding:8px 14px;border-radius:7px}
  .btn:hover{background:var(--bg-2);color:var(--text)}
  .btn.primary{background:linear-gradient(180deg,#d2c3ff,#b6a3ff);color:#1a1730;border:none;font-weight:600}
  .btn.big{font-size:14px;padding:10px 18px}

  .howto{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  @media(max-width:720px){.howto{grid-template-columns:1fr}}
  .howto .h{background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:14px}
  .howto .h .n{font-family:var(--mono);color:var(--accent);font-size:12px}
  .howto .h b{display:block;margin:6px 0 3px}
  .howto .h span{color:var(--text-3);font-size:12.5px}

  .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  @media(max-width:760px){.legend{grid-template-columns:1fr}}
  .pcard{background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:14px}
  .pcard .slot{font-family:var(--mono);font-size:11px;color:var(--accent);background:rgba(201,184,255,.08);border:1px solid rgba(201,184,255,.22);padding:1px 7px;border-radius:4px}
  .pcard .role{font-size:12px;color:var(--text-3);margin:8px 0 4px}.pcard .role b{color:var(--text-2)}
  .pcard input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--text);font-family:var(--sans);outline:none;font-size:12.5px;margin-top:8px}
  .pcard input:focus{border-color:var(--accent)}
  .pcard .ph{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-top:8px;display:block}

  .case{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
  .case[data-state="pass"]{border-color:rgba(122,209,154,.4)}
  .case[data-state="partial"]{border-color:rgba(230,184,106,.4)}
  .case[data-state="fail"]{border-color:rgba(232,125,125,.45)}
  .case-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .case-id{font-family:var(--mono);font-size:11px;color:var(--accent);background:rgba(201,184,255,.08);border:1px solid rgba(201,184,255,.22);padding:1px 7px;border-radius:4px}
  .case-title{font-size:15.5px;font-weight:600}
  .case-goal{color:var(--text-3);font-size:13px;margin:3px 0 14px}
  .case h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin:14px 0 7px;display:flex;align-items:center;gap:7px}
  .case h4 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .case h4.exp .dot{background:var(--green)}
  .case ol{margin:0;padding-left:22px}
  .case ol li{margin:5px 0;color:var(--text-2)}
  .expect{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:11px 14px;color:var(--text-2)}
  .expect b{color:var(--text)}

  .score-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .score-ctl .q{font-size:12px;color:var(--text-4)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg label{padding:7px 14px;font-size:13px;cursor:pointer;color:var(--text-3);border-right:1px solid var(--line);user-select:none}
  .seg label:last-child{border-right:none}.seg input{display:none}
  .seg label.sel-pass{background:rgba(122,209,154,.16);color:var(--green)}
  .seg label.sel-partial{background:rgba(230,184,106,.16);color:var(--amber)}
  .seg label.sel-fail{background:rgba(232,125,125,.16);color:var(--red)}
  .seg label.sel-skip{background:var(--bg-3);color:var(--text-2)}
  .notes{flex:1;min-width:220px}
  .notes input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--text);font-family:var(--sans);outline:none;font-size:13px}
  .notes input:focus{border-color:var(--accent)}

  .nav-foot{display:flex;justify-content:space-between;align-items:center;margin:24px 0 0;gap:12px}
  .blocked-list .bl{background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin:0 0 10px}
  .bl b{color:var(--text)}.bl span{color:var(--text-3);font-size:12.5px}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <div class="brand"><span class="mark"></span> Spade · Guided Test</div>
    <div class="score-box">
      <div class="meter"><i id="meter-fill"></i></div>
      <div><div class="score-num" id="score-num">—</div><div class="score-sub" id="score-sub">0 / 0 done</div></div>
    </div>
  </div>
</header>
<nav class="tabs"><div class="tabs-inner" id="tabbar"></div></nav>

<div class="wrap" id="panels"></div>

<script>
/* ---------- content ---------- */
const TABS = [
  {key:"START", num:0, label:"Start here"},
  {key:"P1",    num:1, label:"Project 1"},
  {key:"P2",    num:2, label:"Project 2"},
  {key:"P3",    num:3, label:"Project 3"},
  {key:"CTX",   num:4, label:"Switching"},
  {key:"FEEL",  num:5, label:"Overall feel"},
  {key:"GAPS",  num:6, label:"Not built"},
];

/* intro HTML shown at the top of the Start tab (not a scored case) */
const START_INTRO = `
  <h1>Spade — guided test &amp; score</h1>
  <p class="lede">A friendly, click-by-click walkthrough. You'll set up <b>three pretend products</b>,
  do a little work in each, then see how well Spade keeps them separate when you switch between them.
  No coding needed — just follow the steps and mark how each one went.</p>

  <div class="howto">
    <div class="h"><span class="n">1</span><b>Do the steps in order</b><span>Each card has numbered steps and a “What you should see”.</span></div>
    <div class="h"><span class="n">2</span><b>Mark how it went</b><span>Tap <b>Pass</b> if it matched, <b>Partial</b> if mostly, <b>Fail</b> if not. Add a quick note.</span></div>
    <div class="h"><span class="n">3</span><b>Move to the next tab</b><span>Your progress saves automatically. The bar up top shows your score.</span></div>
  </div>

  <div class="meta-row">
    <div class="field"><label>Your name</label><input data-meta="tester" placeholder="who's testing"></div>
    <div class="field"><label>Date</label><input data-meta="testdate" placeholder="e.g. 2026-06-27"></div>
  </div>

  <div class="note tip"><b>Before you begin:</b> the app needs to be running.
   If it isn't open already, ask your developer to start it (or run <code>make dev</code>), then open
   <a href="http://127.0.0.1:3000" target="_blank">http://127.0.0.1:3000</a> in your browser.
   Keep that browser window next to this guide.</div>

  <h4 style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin:22px 0 0">The 3 products you'll test with</h4>
  <p class="blurb" style="margin-top:6px">Fill in the names you actually use — later tabs say “Project 1 / 2 / 3”.</p>
  <div class="legend">
    <div class="pcard"><span class="slot">Project 1</span>
      <div class="role"><b>The established one.</b> Already has work in it. Use the built-in <b>“Hello Spade (PoC)”</b>.</div>
      <span class="ph">name you'll use</span><input data-meta="p1name" placeholder="Hello Spade (PoC)"></div>
    <div class="pcard"><span class="slot">Project 2</span>
      <div class="role"><b>The new one.</b> You'll create it empty, then ask Spade to plan its work.</div>
      <span class="ph">name you'll use</span><input data-meta="p2name" placeholder="e.g. Acme Mobile"></div>
    <div class="pcard"><span class="slot">Project 3</span>
      <div class="role"><b>The empty one.</b> Create it and leave it untouched, to see “nothing here yet” screens.</div>
      <span class="ph">name you'll use</span><input data-meta="p3name" placeholder="e.g. Internal Tools"></div>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="btn-export">Copy my results</button>
    <button class="btn" id="btn-reset">Start over (clear everything)</button>
  </div>
`;

const GAPS_HTML = `
  <h2 class="ph">Not built yet — please skip these</h2>
  <p class="blurb">These menu items show a faint “Próximamente” (coming soon) tag and don't open. That's expected —
  don't count them as problems.</p>
  <div class="blocked-list">
    <div class="bl"><b>Overview / Home</b> <span>— dashboards, coming later.</span></div>
    <div class="bl"><b>Sprints</b> <span>— not built.</span></div>
    <div class="bl"><b>Graph &amp; Issues</b> <span>— coming later.</span></div>
    <div class="bl"><b>Meetings</b> &amp; <b>Feedback</b> <span>— need data sources first.</span></div>
    <div class="bl"><b>CLI / logs</b> &amp; <b>Settings</b> <span>— not built.</span></div>
    <div class="bl"><b>“All projects”</b> in the project menu <span>— coming later.</span></div>
  </div>
  <div class="note tip" style="margin-top:18px"><b>That's the whole test.</b> When you're done, go back to
   <b>Start here</b> and tap <b>Copy my results</b> to share your scores and notes.</div>
`;

const CASES = {
  START: [
    {id:"S0-1", title:"Open the app", goal:"Get the app on screen.",
     steps:["Open <a target=_blank href='http://127.0.0.1:3000'>http://127.0.0.1:3000</a> in your browser.","Look at the screen."],
     expect:"A dark page with a <b>menu on the left</b> (Backlog, Product brain, Orchestrator, …) and a <b>bar across the top</b>. Top-right shows a small green dot with “daemon · N sessions” and an account name."},
    {id:"S0-2", title:"Pick Project 1 (the established one)", goal:"Select the project that already has work in it.",
     steps:["At the top-left, click the <b>project name with the little arrow</b> (the project menu).","Choose <b>“Hello Spade (PoC)”</b>."],
     expect:"The top-left now shows “Hello Spade (PoC)”. In the left menu, the small number badges next to <b>Backlog</b>, <b>Product brain</b> and <b>Decisions</b> are <b>not zero</b> — there's real work in here."},
    {id:"S0-3", title:"Create Project 2 (the new one)", goal:"Make a brand-new, empty project.",
     steps:["Open the project menu again → click <b>“New project”</b>.","Type a name (write it in the Project 2 box on this page too).","Notice the <b>Path</b> fills in by itself. Leave it.","Click <b>Create</b>."],
     expect:"The new project name appears at the top-left, and its menu badges show <b>0</b> — it's empty, which is correct for a brand-new project."},
    {id:"S0-4", title:"Create Project 3 (the empty one)", goal:"Make a third project and leave it alone.",
     steps:["Project menu → <b>New project</b> → type a name (write it in the Project 3 box) → <b>Create</b>.","Don't add anything to it."],
     expect:"Third project selected, all badges <b>0</b>. You now have three projects to test with."},
  ],
  P1: [
    {id:"P1-1", title:"Look at the task board", goal:"See the list of work as a board.",
     pre:"Project 1 (Hello Spade) is selected — check the top-left.",
     steps:["In the left menu, click <b>Backlog</b>.","Click any card in the board."],
     expect:"A board with <b>columns</b>: Ready, In progress, Review, Shipped, Blocked — with task cards inside (each shows a colored dot, an ID like <code>SPD-001</code>, and a title). Clicking a card opens that task's <b>own page</b> with more detail (a quote, related info, a timeline down the side)."},
    {id:"P1-2", title:"Look at the knowledge map", goal:"See the project's “brain” and decisions.",
     pre:"Project 1 selected.",
     steps:["Left menu → <b>Product brain</b>. Click one of the dots.","Then left menu → <b>Decisions</b>."],
     expect:"<b>Product brain</b> shows a map of connected dots (a graph) with a legend on the side; clicking a dot shows its details. <b>Decisions</b> shows a list of decision cards. These have real content (not empty)."},
    {id:"P1-3", title:"Ask the assistant about this project", goal:"Chat with the project's AI and get a relevant answer.",
     pre:"Project 1 selected.",
     steps:["Press <kbd>⌘</kbd>+<kbd>K</kbd> (Mac) or <kbd>Ctrl</kbd>+<kbd>K</kbd> (Windows) — or click the <b>“Ask the brain…”</b> bar at the top.","In the panel that slides in from the right, type: <i>What do you know about this project?</i> and press Enter.","Wait a few seconds."],
     expect:"A little <b>“thinking…”</b> animation, then an answer that clearly describes <b>Hello Spade</b> specifically (its tasks, its topics). It should NOT describe some other project."},
  ],
  P2: [
    {id:"P2-1", title:"Switch to Project 2 — it should be empty", goal:"Confirm a new project starts clean.",
     steps:["Top-left project menu → choose <b>Project 2</b>.","Look at Backlog, Product brain, Decisions."],
     expect:"Everything says it's empty in a friendly way (empty board, “nothing here yet”). The badges are <b>0</b>. None of Project 1's work shows up here."},
    {id:"P2-2", title:"Ask Spade to plan the work", goal:"Describe a goal and get a proposed plan back.",
     pre:"Project 2 selected. (If the assistant doesn't respond with a plan, see the note below.)",
     steps:["Open the assistant (<kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>K</kbd>).","Type a goal, for example: <i>Plan out building a simple customer feedback inbox.</i> Press Enter.","Read the reply."],
     expect:"It may ask you a question or two, then it <b>proposes a list of tasks</b> (with which ones depend on others) and <b>asks you to approve</b> — it does <b>not</b> create anything yet."},
    {id:"P2-3", title:"Approve, and watch tasks appear", goal:"Approve the plan and see real tasks created.",
     pre:"Right after P2-2.",
     steps:["Reply <i>go ahead</i> (or “yes, create them”).","Wait for it to confirm.","Open <b>Backlog</b> for Project 2 and click one of the new tasks."],
     expect:"New task cards now appear in <b>Project 2's</b> board. Opening one shows a <b>“Dependencies”</b> area listing how it connects to the others (blocks / related / subtask)."},
    {id:"P2-4", title:"Ask again — it should know the new work", goal:"The assistant reflects what was just created.",
     pre:"After P2-3.",
     steps:["Open the assistant and ask: <i>What's on the backlog now?</i>"],
     expect:"The answer mentions the tasks you just created in Project 2 — proof it's looking at this project's current state."},
  ],
  P3: [
    {id:"P3-1", title:"Switch to Project 3 — still empty", goal:"Confirm the untouched project shows empty screens.",
     steps:["Project menu → choose <b>Project 3</b>.","Look at Backlog, Product brain, Decisions and the menu badges."],
     expect:"Everything is empty / 0, with friendly “nothing here yet” messages. No leftover content from Project 1 or 2."},
    {id:"P3-2", title:"Ask the assistant on the empty project", goal:"Empty (or no-account) projects respond gracefully.",
     steps:["Open the assistant and ask anything about the project."],
     expect:"Either a calm answer that the project is brand-new and empty, OR — if this project has no account connected — a clear message like “No account connected yet… add one in Agent pool.” It should <b>never</b> show a scary error or get stuck."},
  ],
  CTX: [
    {id:"CTX-1", title:"Switching changes the whole screen", goal:"Picking a project updates everything at once.",
     pre:"All three projects exist.",
     steps:["Switch Project 1 → 2 → 3 using the top-left menu, pausing on each."],
     expect:"Every time you switch, the <b>project name</b> (top-left), the <b>menu badges</b>, and whatever you're looking at all change together to the new project. Nothing shows stale numbers from the previous project."},
    {id:"CTX-2", title:"The assistant always talks about the selected project", goal:"Context follows your selection — the big one.",
     pre:"All three exist.",
     steps:["On Project 1: open the assistant, ask <i>Which project is this and what's in it?</i> Read it.","Switch to Project 2, ask the same. Then Project 3, ask the same."],
     expect:"Each answer is about the project you <b>currently have selected</b> — Project 1's answer is about Hello Spade, Project 2's about its planned work, Project 3's about being empty. No answer talks about the wrong project."},
    {id:"CTX-3", title:"Projects don't mix together", goal:"Work in one project never leaks into another.",
     pre:"Project 2 has tasks; Project 3 is empty.",
     steps:["Look at the Backlog of Project 1, then 2, then 3."],
     expect:"Project 2's tasks appear <b>only</b> in Project 2. Project 1 keeps its own. Project 3 stays empty. Each project's counts are its own."},
    {id:"CTX-4", title:"Switch while the assistant is open", goal:"Changing project mid-chat re-points the assistant.",
     pre:"Assistant open with an answer about Project 1 on screen.",
     steps:["Keep the assistant panel open.","Use the top-left menu to switch to Project 2.","Ask a new question in the same panel."],
     expect:"The new answer is about <b>Project 2</b> now. (Note in your comment whether the earlier Project-1 messages stayed on screen and if that felt confusing.)"},
    {id:"CTX-5", title:"Fast switching doesn't break it", goal:"Rapid back-and-forth stays correct.",
     pre:"All three exist.",
     steps:["Quickly switch between the three projects 6–8 times.","Stop on one and open its Backlog and the assistant."],
     expect:"It lands cleanly on the <b>last</b> project you picked — correct content, correct counts, no flicker of the wrong project, no errors, nothing stuck loading."},
  ],
  FEEL: [
    {id:"QL-1", title:"Does it look polished?", goal:"Overall visual quality.",
     steps:["Glance across the screens you visited."],
     expect:"Consistent dark look with purple accents; clean spacing; nothing looks broken, unstyled, or half-loaded."},
    {id:"QL-2", title:"Does it feel quick?", goal:"Responsiveness.",
     steps:["Click around the menu, switch projects, open/close the assistant."],
     expect:"Screens change almost instantly; the live screens (Orchestrator, Agent pool) update on their own without freezing; the assistant panel opens and closes smoothly."},
    {id:"QL-3", title:"Are errors friendly?", goal:"Failures are handled gracefully.",
     steps:["If anything ever shows an error during your test, note what it said."],
     expect:"Any error is a readable, calm message — never a scary raw “500” with no explanation. (Mark <b>Not tested</b> if you never saw an error.)"},
  ],
};

/* ---------- engine ---------- */
const KEY="spade-test-guide-v3";
const SCORES=["pass","partial","fail","skip"];
const LABELS={pass:"Pass",partial:"Partial",fail:"Fail",skip:"Not tested"};
let store=JSON.parse(localStorage.getItem(KEY)||"{}");
store.scores=store.scores||{}; store.notes=store.notes||{}; store.meta=store.meta||{};
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
function allCases(){return Object.values(CASES).flat();}

function caseRow(c){
  const cur=store.scores[c.id]||"skip", note=store.notes[c.id]||"";
  const steps=c.steps.map(s=>`<li>${s}</li>`).join("");
  const seg=SCORES.map(s=>`<label class="opt${cur===s?" sel-"+s:""}" data-id="${c.id}" data-score="${s}"><input type="radio" name="sc-${c.id}" ${cur===s?"checked":""}>${LABELS[s]}</label>`).join("");
  return `<div class="case" data-id="${c.id}" data-state="${cur}">
    <div class="case-head"><span class="case-id">${c.id}</span><span class="case-title">${c.title}</span></div>
    <div class="case-goal">${c.goal}</div>
    ${c.pre?`<div class="case-goal" style="color:var(--text-4)"><b>First:</b> ${c.pre}</div>`:""}
    <h4><span class="dot"></span>Do this</h4><ol>${steps}</ol>
    <h4 class="exp"><span class="dot"></span>What you should see</h4><div class="expect">${c.expect}</div>
    <div class="score-ctl"><span class="q">How did it go?</span><div class="seg">${seg}</div>
      <div class="notes"><input data-note="${c.id}" placeholder="optional note — what you saw / anything off" value="${note.replace(/"/g,'&quot;')}"></div></div>
  </div>`;
}
function panelHTML(t){
  if(t.key==="START") return START_INTRO;
  if(t.key==="GAPS") return GAPS_HTML;
  const titles={P1:"Project 1 — the established product",P2:"Project 2 — plan new work",P3:"Project 3 — the empty one",CTX:"Switching between projects",FEEL:"Overall feel"};
  const blurbs={
    P1:"Make sure <b>Project 1 (Hello Spade)</b> is selected at the top-left, then go through these.",
    P2:"Take a brand-new project from empty to a real backlog by asking the assistant to plan it.",
    P3:"Confirm a truly empty project shows calm “nothing here yet” screens.",
    CTX:"This is the important part — does Spade keep three products separate when you jump between them?",
    FEEL:"A quick gut-check on polish and speed."};
  const rows=(CASES[t.key]||[]).map(caseRow).join("");
  let extra="";
  if(t.key==="P2") extra=`<div class="note warn"><b>If the assistant doesn't propose a plan:</b> open <b>Agent pool</b> in the left menu, find this project's assistant and remove it, then ask again (a fresh assistant is needed). Ask your developer if unsure.</div>`;
  return `<h2 class="ph">${titles[t.key]}</h2><p class="blurb">${blurbs[t.key]}</p>${extra}${rows}`;
}
function render(){
  document.getElementById("tabbar").innerHTML=TABS.map(t=>
    `<button class="tab" data-tab="${t.key}"><span class="tnum">${t.num}</span>${t.label}<span class="tsc" data-tabsc="${t.key}"></span></button>`).join("");
  document.getElementById("panels").innerHTML=TABS.map(t=>{
    const next=TABS[TABS.indexOf(t)+1];
    const foot=`<div class="nav-foot">${TABS.indexOf(t)>0?`<button class="btn" data-goto="${TABS[TABS.indexOf(t)-1].key}">← Back</button>`:"<span></span>"}${next?`<button class="btn primary big" data-goto="${next.key}">Next: ${next.label} →</button>`:"<span></span>"}</div>`;
    return `<section class="panel" data-panel="${t.key}">${panelHTML(t)}${foot}</section>`;
  }).join("");
  Object.entries(store.meta).forEach(([k,v])=>{const el=document.querySelector(`[data-meta="${k}"]`); if(el)el.value=v;});
  showTab(store.activeTab||"START",false);
  recompute();
}
function showTab(key,scroll=true){
  store.activeTab=key; save();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===key));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.dataset.panel===key));
  if(scroll) window.scrollTo({top:0,behavior:"smooth"});
}
function recompute(){
  const sc=store.scores, counts={pass:0,partial:0,fail:0,skip:0};
  allCases().forEach(c=>counts[sc[c.id]||"skip"]++);
  const scored=counts.pass+counts.partial+counts.fail, pct=scored?Math.round((counts.pass+counts.partial*.5)/scored*100):0;
  document.getElementById("score-num").textContent=scored?pct+"%":"—";
  document.getElementById("score-sub").textContent=scored+" / "+allCases().length+" done";
  document.getElementById("meter-fill").style.width=pct+"%";
  TABS.forEach(t=>{
    const el=document.querySelector(`[data-tabsc="${t.key}"]`); if(!el)return;
    const cs=CASES[t.key]; if(!cs){el.textContent="";return;}
    const done=cs.filter(c=>(sc[c.id]||"skip")!=="skip").length;
    el.textContent=done?done+"/"+cs.length:"";
  });
}
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab"); if(tab){showTab(tab.dataset.tab);return;}
  const go=e.target.closest("[data-goto]"); if(go){showTab(go.dataset.goto);return;}
  const opt=e.target.closest(".opt");
  if(opt){
    store.scores[opt.dataset.id]=opt.dataset.score; save();
    const seg=opt.parentElement; seg.querySelectorAll(".opt").forEach(o=>o.className="opt");
    opt.className="opt sel-"+opt.dataset.score; seg.closest(".case").dataset.state=opt.dataset.score; recompute(); return;
  }
  if(e.target.id==="btn-reset"){ if(confirm("Clear all your scores and notes and start over?")){store={scores:{},notes:{},meta:{},activeTab:"START"}; save(); render();} return;}
  if(e.target.id==="btn-export"){ exportMd(); return; }
});
document.addEventListener("input",e=>{
  if(e.target.dataset.note!==undefined){store.notes[e.target.dataset.note]=e.target.value; save();}
  if(e.target.dataset.meta!==undefined){store.meta[e.target.dataset.meta]=e.target.value; save();}
});
function exportMd(){
  const sc=store.scores,nt=store.notes,m=store.meta,counts={pass:0,partial:0,fail:0,skip:0};
  allCases().forEach(c=>counts[sc[c.id]||"skip"]++);
  const scored=counts.pass+counts.partial+counts.fail,pct=scored?Math.round((counts.pass+counts.partial*.5)/scored*100):0;
  let md=`# Spade test run\n\n- Tester: ${m.tester||"—"}\n- Date: ${m.testdate||"—"}\n`;
  md+=`- Projects: 1=${m.p1name||"Hello Spade"}, 2=${m.p2name||"—"}, 3=${m.p3name||"—"}\n`;
  md+=`- Score: **${pct}%** (${scored}/${allCases().length} done) — Pass ${counts.pass} · Partial ${counts.partial} · Fail ${counts.fail} · untested ${counts.skip}\n\n`;
  TABS.filter(t=>CASES[t.key]).forEach(t=>{ md+=`## ${t.label}\n`;
    CASES[t.key].forEach(c=>{const s=sc[c.id]||"skip",mk={pass:"✓ Pass",partial:"~ Partial",fail:"✗ Fail",skip:"· untested"}[s];
      md+=`- ${c.id} ${c.title} — ${mk}`; if(nt[c.id])md+=` — _${nt[c.id]}_`; md+=`\n`;}); md+=`\n`;});
  navigator.clipboard.writeText(md).then(()=>alert("Your results were copied — paste them anywhere to share."),
    ()=>{const w=window.open("","_blank");w.document.write("<pre>"+md.replace(/</g,"&lt;")+"</pre>");});
}
render();
</script>
</body>
</html>
