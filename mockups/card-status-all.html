<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All states — icon + label beside the title</title>
<style>
  :root{
    --bg:#0b0b0d; --bg-1:#111114; --bg-2:#16161a; --bg-3:#1c1c22;
    --line:#26262d; --line-2:#2f2f37; --line-strong:#3a3a44;
    --text:#ecedef; --text-2:#b9bac1; --text-3:#82838c; --text-4:#5b5c66;
    --accent:#c9b8ff; --green:#7ad19a; --amber:#e6b86a; --red:#e87d7d; --blue:#7ab6e6; --pink:#e0a0c8;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:34px 26px 90px}
  .head{max-width:1180px;margin:0 auto 24px}
  h1{font-size:23px;letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--text-2);max-width:780px}
  .wrap{max-width:1180px;margin:0 auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-4);margin:26px 0 10px 2px;font-family:var(--mono)}
  .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}

  .task-card{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:10px 11px}
  .tc-head{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-4);margin-bottom:6px;font-family:var(--mono)}
  .pri{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
  .tc-id{white-space:nowrap;flex:none}
  .tc-feat{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-3)}
  .kind-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:1px 7px 1px 6px;border-radius:20px;border:1px solid;line-height:1.4;white-space:nowrap}
  .kind-pill[data-kind="code"]{color:var(--blue);background:rgba(122,182,230,.12);border-color:rgba(122,182,230,.4)}
  .kind-pill[data-kind="research"]{color:var(--accent);background:rgba(201,184,255,.12);border-color:rgba(201,184,255,.4)}
  .kind-pill[data-kind="docs"]{color:var(--green);background:rgba(122,209,154,.12);border-color:rgba(122,209,154,.4)}

  .titlerow{display:flex;gap:9px;align-items:flex-start}
  .tc-title{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--text);letter-spacing:-.005em;line-height:1.35}
  .st{flex:none;line-height:1.35;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
  .ext{color:var(--text-4);font-weight:400}
  .ic{display:inline-block;vertical-align:-2px}
  .spin{animation:spin 1.1s linear infinite;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="head">
  <h1>Every state — icon + label beside the title</h1>
  <p class="sub">Style <b>B</b> applied to the full status vocabulary, grouped by lifecycle. <b>▶</b>=ready · <b>spinner</b>=an agent is working (spins) · <b>bell</b>=waiting on you (a gate) · <b>⚠</b>=blocked · <b>✓</b>=done. Colour comes from the shared <code>statusMeta()</code>.</p>
</div>
<div class="wrap" id="wrap"></div>

<script>
const KI={code:'<path d="M8 2v3M8 11v3M2 8h3M11 8h3M4 4l2 2M10 10l2 2M4 12l2-2M10 6l2-2"/>',research:'<circle cx="7" cy="7" r="4"/><path d="m13 13-3-3"/>',docs:'<path d="M3.5 2.5h6l3 3v8a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1Z"/><path d="M9.5 2.5v3h3"/><path d="M5.5 8h5M5.5 10.5h5M5.5 13H8"/>'};
const kindSvg=(n)=>`<svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${KI[n]}</svg>`;
const KLAB={code:"Code",research:"Research",docs:"Docs"};

const FI={
  play:(c)=>`<svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="${c}" stroke="none"><path d="M5 3.5v9l7-4.5z"/></svg>`,
  spin:(c)=>`<svg class="ic spin" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><path d="M8 2a6 6 0 1 1-4.2 1.7"/></svg>`,
  bell:(c)=>`<svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="${c}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5a3 3 0 0 0-3 3c0 3.2-1.3 4-1.3 4h8.6S11 8.7 11 5.5a3 3 0 0 0-3-3Z"/><path d="M6.7 12a1.4 1.4 0 0 0 2.6 0"/></svg>`,
  alert:(c)=>`<svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.2v.1"/></svg>`,
  check:(c)=>`<svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>`,
};
function st(s){return `<span class="st" style="color:${s.color}">${FI[s.icon](s.color)}${s.label}${s.extra?` <span class="ext">${s.extra}</span>`:''}</span>`;}

const GROUPS = [
  {h:"Common (any kind)", cards:[
    {id:"SPD-041",kind:"code",feat:"Settings",title:"Add a dark-mode toggle",s:{label:"Ready",color:"var(--green)",icon:"play"}},
    {id:"SPD-036",kind:"docs",feat:"Project Scoping",title:"Draft Statement of Work (SOW)",s:{label:"Blocked",color:"var(--red)",icon:"alert",extra:"· 2"}},
    {id:"SPD-035",kind:"research",feat:"Plant Identification",title:"Research plant-ID approach",s:{label:"Waiting on you",color:"var(--amber)",icon:"bell"}},
  ]},
  {h:"Code lifecycle", cards:[
    {id:"SPD-041",kind:"code",feat:"Settings",title:"Add a dark-mode toggle",s:{label:"Shaping",color:"var(--pink)",icon:"spin"}},
    {id:"SPD-041",kind:"code",feat:"Settings",title:"Add a dark-mode toggle",s:{label:"Building",color:"var(--blue)",icon:"spin"}},
    {id:"SPD-041",kind:"code",feat:"Settings",title:"Add a dark-mode toggle",s:{label:"In review",color:"var(--accent)",icon:"spin"}},
    {id:"SPD-041",kind:"code",feat:"Settings",title:"Add a dark-mode toggle",s:{label:"Shipped",color:"var(--green)",icon:"check"}},
  ]},
  {h:"Research lifecycle", cards:[
    {id:"SPD-035",kind:"research",feat:"Plant Identification",title:"Research plant-ID approach",s:{label:"Scoping",color:"var(--amber)",icon:"spin"}},
    {id:"SPD-035",kind:"research",feat:"Plant Identification",title:"Research plant-ID approach",s:{label:"Investigating",color:"var(--blue)",icon:"spin",extra:"▶ 3"}},
    {id:"SPD-035",kind:"research",feat:"Plant Identification",title:"Research plant-ID approach",s:{label:"Synthesis",color:"var(--accent)",icon:"spin"}},
    {id:"SPD-035",kind:"research",feat:"Plant Identification",title:"Research plant-ID approach",s:{label:"Delivered",color:"var(--green)",icon:"check"}},
  ]},
  {h:"Docs lifecycle", cards:[
    {id:"SPD-036",kind:"docs",feat:"Project Scoping",title:"Draft Statement of Work (SOW)",s:{label:"Outline",color:"var(--amber)",icon:"spin"}},
    {id:"SPD-036",kind:"docs",feat:"Project Scoping",title:"Draft Statement of Work (SOW)",s:{label:"Drafting",color:"var(--blue)",icon:"spin"}},
    {id:"SPD-036",kind:"docs",feat:"Project Scoping",title:"Draft Statement of Work (SOW)",s:{label:"Delivered",color:"var(--green)",icon:"check"}},
  ]},
];

function card(c){return `<div class="task-card">
  <div class="tc-head"><span class="pri"></span><span class="tc-id">${c.id}</span>
    <span class="kind-pill" data-kind="${c.kind}">${kindSvg(c.kind)}${KLAB[c.kind]}</span>
    <span class="tc-feat">${c.feat}</span></div>
  <div class="titlerow"><div class="tc-title">${c.title}</div>${st(c.s)}</div>
</div>`;}

document.getElementById('wrap').innerHTML = GROUPS.map(g=>`
  <h2>${g.h}</h2><div class="row">${g.cards.map(card).join('')}</div>`).join('');
</script>
</body>
</html>
